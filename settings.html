<div class="preference-roulette-settings inline-drawer">
    <div class="inline-drawer-toggle inline-drawer-header">
        <b>Preference Roulette</b>
        <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
    </div>
    <div class="inline-drawer-content">
        <label class="checkbox_label">
            <input type="checkbox" id="pr_enabled" />
            <span>Enabled</span>
        </label>

        <label for="pr_keywords">Keywords (comma separated)</label>
        <textarea id="pr_keywords" class="text_pole" rows="6"
            placeholder="shy, playful, sarcastic, romantic, mysterious, blunt"></textarea>

        <label for="pr_every">Reroll every N bot replies</label>
        <input type="number" id="pr_every" class="text_pole" min="1" step="1" value="5" />

        <div class="flex-container alignItemsCenter" style="gap:8px; margin-top:8px;">
            <input type="button" id="pr_reroll" class="menu_button" value="Reroll now" />
            <span id="pr_status" style="opacity:0.8;"></span>
        </div>

        <small style="display:block; margin-top:8px; opacity:0.7;">
            Use <code>{{preference}}</code> anywhere in a prompt, character field, or author's note to insert the current keyword.
        </small>
    </div>
</div>
